services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      HACK_API_URL: ${HACK_API_URL:-https://hack-api.be-healthy.tech}
      HACK_TEAM_TOKEN: ${HACK_TEAM_TOKEN:-}
      HACK_RUN_STAGE: ${HACK_RUN_STAGE:-final}
      HACK_VOICE_ENABLED: ${HACK_VOICE_ENABLED:-0}
      HACK_VOICE_ACCESS_KEY: ${HACK_VOICE_ACCESS_KEY:-}
      HACK_STT_MODEL: ${HACK_STT_MODEL:-gpt-transcribe}
      HACK_TTS_MODEL: ${HACK_TTS_MODEL:-tts-1}
      FRONTEND_ADMIN_KEY: ${FRONTEND_ADMIN_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ENABLE_LEGACY_DEMO: ${ENABLE_LEGACY_DEMO:-true}
      ROOM_DB_PATH: /app/data/rooms.sqlite3
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-60}
      LLM_PROVIDER: ${LLM_PROVIDER:-sain}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}

    volumes:
      - room_data:/app/data

volumes:
  room_data:
